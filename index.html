<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joule's Law & Calorimeter Virtual Lab</title>
    <!-- Tailwind CSS & Chart.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8">
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold text-center text-blue-700 mb-2">ชุดการทดลองเสมือนจริง: กฎของจูลและความจุความร้อนจำเพาะ</h1>
        <p class="text-center text-slate-500 mb-6">Virtual Calorimeter Laboratory Simulator</p>

        <!-- Navigation Tabs -->
        <div class="flex border-b mb-6 overflow-x-auto">
            <button onclick="switchTab(1)" id="tab-1" class="py-2 px-4 border-b-2 font-semibold border-blue-600 text-blue-600 whitespace-nowrap">ตอนที่ 1: หาค่า R ของขดลวด</button>
            <button onclick="switchTab(2)" id="tab-2" class="py-2 px-4 border-b-2 font-semibold border-transparent text-slate-500 whitespace-nowrap">ตอนที่ 2: ต้มน้ำ (Water)</button>
            <button onclick="switchTab(3)" id="tab-3" class="py-2 px-4 border-b-2 font-semibold border-transparent text-slate-500 whitespace-nowrap">ตอนที่ 3: ต้มแอลกอฮอล์ (Ethanol)</button>
        </div>

        <!-- Global Settings -->
        <div class="bg-slate-50 p-4 rounded-lg mb-6 flex flex-wrap gap-4 items-center justify-between border">
            <div class="flex items-center gap-2">
                <span class="font-medium text-sm md:text-base">โหมดการทดลอง:</span>
                <label class="inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="lossToggle" class="sr-only peer">
                    <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600 relative"></div>
                    <span class="ml-3 text-sm font-medium text-slate-700" id="lossLabel">Ideal 100% (ไม่มี Heat Loss)</span>
                </label>
            </div>
            <button onclick="downloadCSV()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2">
                📥 ดาวน์โหลดข้อมูลสรุป (CSV)
            </button>
        </div>

        <!-- Tab 1 Content -->
        <div id="content-1" class="tab-content grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-50 p-4 rounded-lg border">
                <h3 class="font-bold text-lg mb-4">ตั้งค่าแรงดันไฟฟ้า (V)</h3>
                <label class="block text-sm mb-1">ความต่างศักย์: <span id="vVal">12</span> V</label>
                <input type="range" id="vInput" min="2" max="24" step="2" value="12" class="w-full mb-4" oninput="updatePart1()">
                <button onclick="recordPart1Data()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700">บันทึกค่ากระแสไฟฟ้า (I)</button>
            </div>
            <div class="md:col-span-2 bg-slate-50 p-4 rounded-lg border">
                <h3 class="font-bold text-lg mb-2">ตารางบันทึกผล ตอนที่ 1</h3>
                <div class="overflow-y-auto max-h-48">
                    <table class="w-full text-sm text-left border-collapse">
                        <thead><tr class="bg-slate-200"><th class="p-2">ครั้งที่</th><th class="p-2">V (Volts)</th><th class="p-2">I Measured (A) [±5% Error]</th></tr></thead>
                        <tbody id="p1Table"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Tab 2 Content -->
        <div id="content-2" class="tab-content hidden grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-50 p-4 rounded-lg border space-y-4">
                <h3 class="font-bold text-lg text-blue-700">ตั้งค่าการทดลอง: น้ำ</h3>
                <div>
                    <label class="block text-sm">ปริมาตร ($cm^3$):</label>
                    <input type="number" id="vol2" value="200" min="50" max="500" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm">อุณหภูมิเริ่มต้น ($^\circ C$):</label>
                    <input type="number" id="temp2" value="25" min="15" max="35" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm">ความต่างศักย์ (V):</label>
                    <input type="number" id="v2" value="12" min="2" max="24" class="w-full p-2 border rounded">
                </div>
                <button onclick="startSimulation(2)" id="startBtn2" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700">เริ่มการทดลอง (ต้มน้ำ)</button>
            </div>
            <div class="md:col-span-2 bg-slate-50 p-4 rounded-lg border">
                <canvas id="chart2" class="w-full h-64"></canvas>
            </div>
        </div>

        <!-- Tab 3 Content -->
        <div id="content-3" class="tab-content hidden grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-50 p-4 rounded-lg border space-y-4">
                <h3 class="font-bold text-lg text-purple-700">ตั้งค่าการทดลอง: แอลกอฮอล์</h3>
                <div>
                    <label class="block text-sm">ปริมาตร ($cm^3$):</label>
                    <input type="number" id="vol3" value="200" min="50" max="500" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm">อุณหภูมิเริ่มต้น ($^\circ C$):</label>
                    <input type="number" id="temp3" value="25" min="15" max="35" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm">ความต่างศักย์ (V):</label>
                    <input type="number" id="v3" value="12" min="2" max="24" class="w-full p-2 border rounded">
                </div>
                <button onclick="startSimulation(3)" id="startBtn3" class="w-full bg-purple-600 text-white py-2 rounded-lg font-medium hover:bg-purple-700">เริ่มการทดลอง (ต้มแอลกอฮอล์)</button>
            </div>
            <div class="md:col-span-2 bg-slate-50 p-4 rounded-lg border">
                <canvas id="chart3" class="w-full h-64"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Physics Constants
        const R_TRUE = 4.0; // ค่าความต้านทานจริงของขดลวด (Ohms)
        const C_WATER = 4.184; // J/(g·°C)
        const RHO_WATER = 1.0; // g/cm³
        const C_ETHANOL = 2.440; // J/(g·°C)
        const RHO_ETHANOL = 0.789; // g/cm³

        let p1Data = [];
        let expLogs = []; 
        let simInterval = null;
        let chart2 = null, chart3 = null;

        document.getElementById('lossToggle').addEventListener('change', (e) => {
            document.getElementById('lossLabel').innerText = e.target.checked 
                ? "Realistic (มีสูญเสียความร้อน)" 
                : "Ideal 100% (ไม่มี Heat Loss)";
        });

        function switchTab(tabNum) {
            [1, 2, 3].forEach(n => {
                document.getElementById(`tab-${n}`).className = n === tabNum 
                    ? "py-2 px-4 border-b-2 font-semibold border-blue-600 text-blue-600 whitespace-nowrap"
                    : "py-2 px-4 border-b-2 font-semibold border-transparent text-slate-500 whitespace-nowrap";
                document.getElementById(`content-${n}`).classList.add('hidden');
            });

            document.getElementById(`content-${tabNum}`).classList.remove('hidden');

            // สร้างกราฟเมื่อแท็ปเปิดขึ้นมาแล้วเท่านั้น
            if (tabNum === 2 && !chart2) initChart(2);
            if (tabNum === 3 && !chart3) initChart(3);
        }

        function updatePart1() {
            document.getElementById('vVal').innerText = document.getElementById('vInput').value;
        }

        function recordPart1Data() {
            const V = parseFloat(document.getElementById('vInput').value);
            const I_true = V / R_TRUE;
            const error = 1 + (Math.random() * 0.1 - 0.05); // Random error ±5%
            const I_measured = (I_true * error).toFixed(2);
            
            p1Data.push({ V, I: I_measured });
            expLogs.push({ Tab: "ตอนที่ 1", Liquid: "-", V, I: I_measured, Time_s: "-", Temp_C: "-" });

            const tbody = document.getElementById('p1Table');
            tbody.innerHTML += `<tr class="border-b"><td class="p-2">${p1Data.length}</td><td class="p-2">${V}</td><td class="p-2">${I_measured}</td></tr>`;
        }

        function initChart(tabNum) {
            const canvasId = tabNum === 2 ? 'chart2' : 'chart3';
            const color = tabNum === 2 ? '#2563eb' : '#9333ea';
            const ctx = document.getElementById(canvasId).getContext('2d');
            
            const newChart = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [{ label: 'อุณหภูมิ (°C)', data: [], borderColor: color, backgroundColor: color, fill: false }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { title: { display: true, text: 'เวลา (วินาที)' } }, y: { title: { display: true, text: 'อุณหภูมิ (°C)' }, max: 55 } } }
            });

            if (tabNum === 2) chart2 = newChart;
            if (tabNum === 3) chart3 = newChart;
        }

        function startSimulation(tabNum) {
            clearInterval(simInterval);
            
            const isWater = tabNum === 2;
            const liquidName = isWater ? "Water" : "Ethanol";
            const c = isWater ? C_WATER : C_ETHANOL;
            const rho = isWater ? RHO_WATER : RHO_ETHANOL;
            const targetChart = isWater ? chart2 : chart3;

            // Reset Chart Data
            targetChart.data.labels = [];
            targetChart.data.datasets[0].data = [];
            targetChart.update();

            const vol = parseFloat(document.getElementById(isWater ? 'vol2' : 'vol3').value);
            const mass = vol * rho;
            let currentTemp = parseFloat(document.getElementById(isWater ? 'temp2' : 'temp3').value);
            const V = parseFloat(document.getElementById(isWater ? 'v2' : 'v3').value);
            const P_elec = (V * V) / R_TRUE;

            const hasLoss = document.getElementById('lossToggle').checked;
            const k = 0.05;
            const T_room = 25.0;

            let timeSec = 0;
            const btn = document.getElementById(isWater ? 'startBtn2' : 'startBtn3');
            btn.disabled = true;
            btn.classList.add('opacity-50');

            simInterval = setInterval(() => {
                timeSec += 5;

                let P_loss = hasLoss ? k * (currentTemp - T_room) : 0;
                let P_net = Math.max(0, P_elec - P_loss);
                let dT = (P_net * 5) / (mass * c);
                currentTemp += dT;

                const noise = 1 + (Math.random() * 0.02 - 0.01);
                const measuredTemp = (currentTemp * noise).toFixed(2);

                targetChart.data.labels.push(timeSec);
                targetChart.data.datasets[0].data.push(measuredTemp);
                targetChart.update();

                expLogs.push({ Tab: `ตอนที่ ${tabNum}`, Liquid: liquidName, V, I: (V/R_TRUE).toFixed(2), Time_s: timeSec, Temp_C: measuredTemp });

                if (currentTemp >= 50 || timeSec >= 600) {
                    clearInterval(simInterval);
                    btn.disabled = false;
                    btn.classList.remove('opacity-50');
                    alert(`จบการทดลอง (${liquidName}): สิ้นสุดที่อุณหภูมิ ${measuredTemp} °C เวลา ${timeSec} วินาที`);
                }
            }, 200);
        }

        function downloadCSV() {
            if (expLogs.length === 0) { alert("ยังไม่มีข้อมูลการทดลอง"); return; }
            let csvContent = "data:text/csv;charset=utf-8,Tab,Liquid,Voltage(V),Current(A),Time(s),Temp(degC)\n";
            expLogs.forEach(r => {
                csvContent += `${r.Tab},${r.Liquid},${r.V},${r.I},${r.Time_s},${r.Temp_C}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "joule_lab_results.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
